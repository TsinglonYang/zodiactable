plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    id 'kotlin-kapt'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.example.zodiactableapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.zodiactableapp11"
        minSdk 21
        targetSdk 36
        versionCode 9
        versionName "4.0.0"

        // 0 = 保留全部 2 张默认单；1/2 = 单张单模式（对应 第1/2号单）
        buildConfigField "int", "SEED_ORDER_NO", "0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions += "edition"

    productFlavors {
        app1 {
            dimension "edition"
            applicationIdSuffix ".app1"
            resValue "string", "app_name", "生肖投注助手"
            resValue "bool", "show_zodiac_numbers", "true"
        }
        app2 {
            dimension "edition"
            applicationIdSuffix ".app2"
            resValue "string", "app_name", "生肖投注助手"
        }
        app3 {
            dimension "edition"
            applicationIdSuffix ".app3"
            resValue "string", "app_name", "生肖投注助手"
        }
        app4 {
            dimension "edition"
            applicationIdSuffix ".app4"
            resValue "string", "app_name", "生肖投注助手"
        }
        app5 {
            dimension "edition"
            applicationIdSuffix ".app5"
            resValue "string", "app_name", "生肖投注助手"
        }
        app6 {
            dimension "edition"
            applicationIdSuffix ".app6"
            resValue "string", "app_name", "生肖投注助手"
        }
        app7 {
            dimension "edition"
            applicationIdSuffix ".app7"
            resValue "string", "app_name", "生肖投注助手"
        }
        app8 {
            dimension "edition"
            applicationIdSuffix ".app8"
            resValue "string", "app_name", "生肖投注助手"
        }
        app9 {
            dimension "edition"
            applicationIdSuffix ".app9"
            resValue "string", "app_name", "生肖投注助手"
        }
        app10 {
            dimension "edition"
            applicationIdSuffix ".app10"
            resValue "string", "app_name", "生肖投注助手"
        }
        // 双单版：两个独立的单张单应用，各保留对应的一张默认单
        s1 {
            dimension "edition"
            applicationIdSuffix ".s1"
            resValue "string", "app_name", "双单·壹"
            buildConfigField "int", "SEED_ORDER_NO", "1"
        }
        s2 {
            dimension "edition"
            applicationIdSuffix ".s2"
            resValue "string", "app_name", "双单·贰"
            buildConfigField "int", "SEED_ORDER_NO", "2"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

kapt {
    correctErrorTypes = true
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}


dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx

    // ===== Room =====
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"


    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core




}
